# Builds this fork's modded Spidy (Index pause/heal, wrist HUD, tutorial) on every push to its
# branch, and keeps the player zip with the run: Actions > Build mod > the latest run > Artifacts.
# Unlike Release, it publishes nothing and needs no secrets (the build is unsigned).
name: Build mod
on:
  push:
    branches: ['index-hud-tutorial']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12' # the Python that tools/package.ps1 ships

      - name: Fetch the pinned OpenXR SDK, Dear ImGui and MinHook
        run: ./tools/bootstrap.ps1 -Observer

      - name: Build and run the C++ tests
        run: ./tools/build.ps1 -Observer

      - name: Package
        run: ./tools/package.ps1

      - name: Keep the zip with this run
        uses: actions/upload-artifact@v7
        with:
          name: Spidy-modded-win64
          path: dist/*.zip
          retention-days: 30

      - name: Publish the download (Releases > Spidy modded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          $zip = Join-Path dist (($source.BaseName -replace '-win64$', '-modded-win64') + '.zip')
          Move-Item $source.FullName $zip
          $notes = @"
          Spidy 0.4.0 with this fork's changes, built from commit $env:GITHUB_SHA.

          Download the zip below, extract it to a folder of its own and run Spidy Launcher.exe.
          Do not take the launcher's update offer: it would put the official Spidy back.

          New in the SPIDY VR settings tab: ARM SENSITIVITY, SWING ASSIST and WEB ALIGN (under SWINGING),
          RECORDING VIEW and RECORDING FOV (under DISPLAY). Also: Index trackpad pause (left) and heal
          (right), the wrist health bar with its heal button, and the optional VR tutorial.
          "@
          $tag = 'spidy-modded'
          gh release view $tag *> $null
          if ($LASTEXITCODE) {
            gh release create $tag $zip --target $env:GITHUB_SHA --title 'Spidy modded (Index, HUD, tutorial)' --notes $notes --latest
          } else {
            gh release delete $tag --yes --cleanup-tag
            gh release create $tag $zip --target $env:GITHUB_SHA --title 'Spidy modded (Index, HUD, tutorial)' --notes $notes --latest
          }
          if ($LASTEXITCODE) { throw 'Publishing the release failed' }
